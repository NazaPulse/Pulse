# Pulse — Reverse proxy / gateway único.
#
# APIs (mismo origen que los frontends -> sin CORS). Cada prefijo "monta" un
# backend completo y se quita antes de reenviar:
#   /api/node/*   y /api/v1/*  -> backend-node:3000/*    (NestJS)
#   /api/python/* y /api/v2/*  -> backend-python:8000/*  (FastAPI)
#   p. ej. /api/node/api/auth/login       -> backend-node   /api/auth/login
#          /api/python/uploads/audio/x.wav -> backend-python /uploads/audio/x.wav
#
# Frontends (puerto 80, por nombre de host):
#   http://localhost  · http://react.localhost -> frontend-react
#   http://vue.localhost                       -> frontend-vue
# Alternativa sin DNS: el puerto 8080 del gateway sirve frontend-vue.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # Las notas de voz admiten hasta 10 MB (openapi.yaml).
    client_max_body_size 11m;

    # Resolver de Docker: los upstreams se resuelven en cada pedido, así el
    # gateway arranca aunque algún servicio todavía no esté listo.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;


    server {
        listen 80 default_server;
        server_name localhost react.localhost;
        include /etc/nginx/pulse-api-locations.conf;

        location / {
            set $frontend http://frontend-react:80;
            proxy_pass $frontend;
        }
    }

    server {
        listen 80;
        listen 8080;
        server_name vue.localhost;
        include /etc/nginx/pulse-api-locations.conf;

        location / {
            set $frontend http://frontend-vue:80;
            proxy_pass $frontend;
        }
    }
}
