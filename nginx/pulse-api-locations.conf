# Locations de API incluidas en cada `server` de nginx.conf.
# Con variables en proxy_pass, el prefijo se quita con `rewrite ... break`.

location ~ ^/api/(node|v1)(/.*)?$ {
    set $backend_node http://backend-node:3000;
    rewrite ^/api/(?:node|v1)/?(.*)$ /$1 break;
    proxy_pass $backend_node;
}

location ~ ^/api/(python|v2)(/.*)?$ {
    set $backend_python http://backend-python:8000;
    rewrite ^/api/(?:python|v2)/?(.*)$ /$1 break;
    proxy_pass $backend_python;
}

location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}
