# Pulse — ecosistema completo: db · backend-node · backend-python ·
# frontend-react · frontend-vue · proxy (gateway Nginx).
#
# Requiere un `.env` en la raíz (copiar `.env.example`). Los secretos no tienen
# default: si faltan, `docker compose` se detiene con un error explícito.
#
#   docker compose up -d --build
#   http://localhost          -> Frontend React (API: /api/node -> NestJS)
#   http://vue.localhost      -> Frontend Vue   (API: /api/python -> FastAPI)
#   http://localhost:8080     -> Frontend Vue (alternativa sin DNS)
#
# Solo la base (`docker compose up -d db`) sigue sirviendo al desarrollo local
# de los backends en localhost:5432, igual que antes.

x-backend-env: &backend-env
  DB_HOST: db
  DB_PORT: 5432
  DB_USER: ${POSTGRES_USER:?Definí POSTGRES_USER en .env}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
  DB_NAME: ${POSTGRES_DB:?Definí POSTGRES_DB en .env}
  JWT_SECRET: ${JWT_SECRET:?Definí JWT_SECRET en .env}
  ARGON2_MEMORY_COST: ${ARGON2_MEMORY_COST:-19456}
  ARGON2_TIME_COST: ${ARGON2_TIME_COST:-2}
  ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-1}

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Definí POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Definí POSTGRES_DB en .env}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-node:
    build:
      context: ./backend-node
      target: runtime
    restart: unless-stopped
    environment:
      <<: *backend-env
      NODE_ENV: production
      PORT: 3000
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600s}
    volumes:
      - uploads_node:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

  backend-python:
    build:
      context: ./backend-python
      target: runtime
    restart: unless-stopped
    environment:
      <<: *backend-env
      NODE_ENV: production
      PORT: 8000
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-3600}
    volumes:
      - uploads_python:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  frontend-react:
    build:
      context: ./frontend-react
      target: runtime
      additional_contexts:
        shared: ./frontend-shared
      args:
        VITE_API_BASE_URL: ${REACT_API_BASE_URL:-/api/node}
    restart: unless-stopped
    expose:
      - "80"

  frontend-vue:
    build:
      context: ./frontend-vue
      target: runtime
      additional_contexts:
        shared: ./frontend-shared
      args:
        VITE_API_BASE_URL: ${VUE_API_BASE_URL:-/api/python}
    restart: unless-stopped
    expose:
      - "80"

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-80}:80"
      - "${PROXY_VUE_PORT:-8080}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/pulse-api-locations.conf:/etc/nginx/pulse-api-locations.conf:ro
    depends_on:
      - backend-node
      - backend-python
      - frontend-react
      - frontend-vue
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  uploads_node:
  uploads_python:
