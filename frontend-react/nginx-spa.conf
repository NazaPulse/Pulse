# Servidor estático de la SPA (detrás del gateway /nginx/nginx.conf).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Assets con hash de Vite: cache largo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # History API (vue-router / react-router): toda ruta desconocida -> index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
